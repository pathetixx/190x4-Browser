<!doctype html>
<!--
  Проверка исполнителя косметики (crates/adblock/src/cosmetic.js) без Windows и
  без WebView2: настройки — вместо __X4_CONFIG__, мост — заглушка.

    chromium --headless=new --virtual-time-budget=6000 --dump-dom \
      file://$PWD/scripts/test/cosmetic-script.html | grep 'data-ok="true"'
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>cosmetic.js</title>
    <script>
      window.__sent = [];
      window.__handlers = [];
      window.chrome = window.chrome || {};
      window.chrome.webview = {
        postMessage(message) {
          window.__sent.push(JSON.parse(JSON.stringify(message)));
        },
        addEventListener(type, handler) {
          if (type === "message") window.__handlers.push(handler);
        },
      };
      const css = (arg) => ({ type: "css-selector", arg });
      var __X4_CONFIG__ = {
        host: location.hostname,
        site: "example.com",
        aggressive: false,
        // Правила списков: в обычном режиме прячут сразу, а со своего
        // содержимого сайта снимаются (как у Brave).
        hide: [".tp-ad", ".fp-bait", ".text-card", ".adfox-wrap", ".fp-own"],
        css: ".promo{display:none!important}\n.banner{height:1px}\n",
        generic: true,
        procedural: [
          { selector: [css("div.card"), { type: "has-text", arg: "Реклама" }] },
          { selector: [css("span.label"), { type: "has-text", arg: "/^\\s*Промо\\s*$/" }, { type: "upward", arg: "2" }] },
          { selector: [css("div.post"), { type: "has-text", arg: "спонсор" }, css(" > .body")], action: { type: "remove" } },
          { selector: [css("div.box")], action: { type: "remove-attr", arg: "onclick" } },
          { selector: [css("section.feed div"), { type: "min-text-length", arg: "20" }], action: { type: "style", arg: "outline: 2px solid red" } },
          { selector: [css("a"), { type: "matches-attr", arg: 'data-kind="ad"' }] },
          { selector: [{ type: "xpath", arg: "//p[contains(., 'партнёр')]" }] },
          { selector: [css("div.late"), { type: "has-text", arg: "Реклама" }] },
          { selector: [{ type: "matches-path", arg: "/nowhere-at-all/" }, css("div.card")] },
        ],
      };
    </script>
    <script src="../../crates/adblock/src/cosmetic.js"></script>
  </head>
  <body>
    <div class="promo" id="promo">промо</div>
    <div class="banner" id="banner">баннер</div>
    <div class="card" id="ad-card">Реклама · купите</div>
    <div class="card" id="news-card">Новости</div>
    <div class="outer" id="outer"><div><span class="label">Промо</span></div></div>
    <div class="post" id="post"><div class="body" id="post-body">от спонсор</div></div>
    <div class="box" id="box" onclick="return 1">коробка</div>
    <section class="feed"><div id="long">это достаточно длинный текст ленты</div><div id="short">коротко</div></section>
    <a href="#" id="ad-link" data-kind="ad">ссылка</a>
    <a href="#" id="plain-link" data-kind="news">ссылка</a>
    <p id="partner">наш партнёр</p>
    <div class="ad-banner" id="generic">общий баннер</div>
    <div class="tp-ad" id="tp-ad"><img src="https://ads.thirdparty.test/banner.png" alt="" /></div>
    <div><div class="fp-bait" id="fp-bait" aria-label="Реклама"></div></div>
    <div class="text-card" id="text-card"><img src="https://cdn.thirdparty.test/a.png" alt="" />Это обычная карточка с длинным текстом новости сайта</div>
    <div class="adfox-wrap" id="adfox-wrap"><div id="adfox_12345"></div></div>
    <div class="fp-own" id="fp-own"><img src="https://img.example.com/own.png" alt="" /></div>
    <div class="list-generic" id="list-generic"><img src="https://ads.thirdparty.test/g.png" alt="" /></div>
    <pre id="out"></pre>
    <script>
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const shown = (id) => getComputedStyle(document.getElementById(id)).display !== "none";
      const checks = {};

      (async () => {
        await wait(400);
        checks.css_hide = !shown("promo") && shown("news-card");
        checks.css_style = getComputedStyle(document.getElementById("banner")).height === "1px";
        checks.has_text = !shown("ad-card");
        checks.upward = !shown("outer");
        checks.remove = !document.getElementById("post-body") && Boolean(document.getElementById("post"));
        checks.remove_attr = !document.getElementById("box").hasAttribute("onclick");
        checks.style = document.getElementById("long").style.outlineStyle === "solid" && !document.getElementById("short").style.outlineStyle;
        checks.matches_attr = !shown("ad-link") && shown("plain-link");
        checks.xpath = !shown("partner");
        checks.path_mismatch = shown("news-card");
        // Стили не видны странице: ни в DOM, ни в document.styleSheets.
        checks.hidden_from_page =
          !Array.from(document.querySelectorAll("style")).some((sheet) => sheet.textContent.includes(".promo")) &&
          !Array.from(document.styleSheets).some((sheet) => Array.from(sheet.cssRules).some((rule) => rule.cssText.includes(".promo")));

        // Общие правила: страница сообщила свои классы, браузер ответил селектором.
        const asked = __sent.filter((m) => m.evt === "cosmetic_ids");
        checks.generic_asked = asked.some((m) => m.classes.includes("ad-banner") && m.ids.includes("generic"));
        for (const handler of __handlers) {
          handler({ data: { cmd: "cosmetic_css", origin: location.origin, selectors: [".list-generic"], force: [".ad-banner"] } });
        }
        await wait(50);
        // Свои правила (force) прячут сразу и навсегда.
        checks.generic_hidden = !shown("generic");
        await wait(3000);
        // Проверка «свой или чужой»: чужая картинка — спрятано; без ресурсов,
        // своя картинка или заметный текст — открыто; id adfox_ — спрятано.
        // Обход, как у Brave, идёт и по следующим соседям, поэтому приманка —
        // в своём контейнере.
        checks.third_party_stays_hidden = !shown("tp-ad") && !shown("list-generic");
        checks.bait_unhidden = shown("fp-bait");
        checks.own_resource_unhidden = shown("fp-own");
        checks.text_unhidden = shown("text-card");
        checks.known_ad_id_hidden = !shown("adfox-wrap");

        // Позже добавленный элемент: и процедурное правило, и новый класс.
        const late = document.createElement("div");
        late.className = "late fresh-class";
        late.id = "late";
        late.textContent = "Реклама позже";
        document.body.append(late);
        // Узел внутри другого добавленного: поддерево обходится один раз, но
        // его классы не теряются.
        const wrap = document.createElement("div");
        wrap.className = "late-wrap";
        document.body.append(wrap);
        const inner = document.createElement("span");
        inner.className = "late-inner";
        wrap.append(inner);
        // Сайт сам переписал свои листы — наши возвращаются на ближайшем проходе.
        document.adoptedStyleSheets = [];
        await wait(900);
        checks.sheets_restored = !shown("promo") && !shown("generic");
        checks.late_procedural = !shown("late");
        checks.late_survey = __sent.some((m) => m.evt === "cosmetic_ids" && m.classes.includes("fresh-class"));
        checks.late_nested = __sent.some((m) => m.evt === "cosmetic_ids" && m.classes.includes("late-wrap") && m.classes.includes("late-inner"));
        checks.no_repeat = __sent.filter((m) => m.evt === "cosmetic_ids" && m.classes.includes("ad-banner")).length === 1;

        const ok = Object.values(checks).every(Boolean);
        const out = document.getElementById("out");
        out.dataset.ok = String(ok);
        out.textContent = JSON.stringify(checks);
      })();
    </script>
  </body>
</html>

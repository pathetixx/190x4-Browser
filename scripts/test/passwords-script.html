<!doctype html>
<!--
  Проверка скрипта менеджера паролей (crates/webview/src/inject/passwords.js)
  без Windows и без WebView2: вместо chrome.webview — заглушка.

    chromium --headless=new --virtual-time-budget=6000 --dump-dom \
      file://$PWD/scripts/test/passwords-script.html | grep 'data-ok="true"'
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>passwords.js</title>
    <!-- Сначала скрипт, потом мост: так в WebView2 бывает на создании документа. -->
    <script src="../../crates/webview/src/inject/passwords.js"></script>
    <script>
      // Мост WebView2 появляется уже после встроенного скрипта.
      window.__sent = [];
      window.__handlers = [];
      window.chrome = window.chrome || {};
      window.chrome.webview = {
        postMessage(message) {
          window.__sent.push(JSON.parse(JSON.stringify(message)));
        },
        addEventListener(type, handler) {
          if (type === "message") window.__handlers.push(handler);
        },
      };
    </script>
  </head>
  <body>
    <form id="login" action="#" onsubmit="return false">
      <label for="u">Username</label><input id="u" type="text" />
      <label for="p">Password</label><input id="p" type="password" />
      <button type="submit">Login</button>
    </form>
    <pre id="out"></pre>
    <script>
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const checks = {};

      (async () => {
        await wait(300);
        checks.form_detected = __sent.some((m) => m.evt === "password_form");

        // Вход по Enter в поле пароля.
        document.getElementById("u").value = "tomsmith";
        const password = document.getElementById("p");
        password.value = "SuperSecretPassword!";
        password.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        await wait(50);
        const submit = __sent.find((m) => m.evt === "password_submit");
        checks.submit = submit?.username === "tomsmith" && submit?.password === "SuperSecretPassword!";

        // Форма исчезла — вход подтверждён.
        document.getElementById("login").remove();
        await wait(900);
        checks.commit = __sent.some((m) => m.evt === "password_commit");

        // Заполнение: сообщение с чужим origin игнорируется, со своим — заполняет.
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<form id="f2"><input id="u2" type="email" autocomplete="username"><input id="p2" type="password"></form>'
        );
        for (const h of __handlers) h({ data: { cmd: "password_fill", origin: "https://evil.example", username: "x", password: "y" } });
        checks.foreign_origin_ignored = document.getElementById("p2").value === "";
        let input = false;
        document.getElementById("u2").addEventListener("input", () => (input = true));
        for (const h of __handlers) h({ data: { cmd: "password_fill", origin: location.origin, username: "me@190x4.pw", password: "hunter2" } });
        checks.filled = document.getElementById("u2").value === "me@190x4.pw" && document.getElementById("p2").value === "hunter2";
        checks.input_event = input;

        // Вход без формы по кнопке: логин — соседнее поле, а не размеченное в чужой форме.
        __sent.length = 0;
        document.body.insertAdjacentHTML(
          "beforeend",
          '<div><input id="u3" type="text"><input id="p3" type="password"><button id="b3" type="button">Войти</button></div>'
        );
        document.getElementById("u3").value = "spa-user";
        document.getElementById("p3").value = "spa-pass";
        document.getElementById("b3").click();
        const spa = __sent.find((m) => m.evt === "password_submit");
        checks.click_submit = spa?.username === "spa-user" && spa?.password === "spa-pass";

        const out = document.getElementById("out");
        out.textContent = JSON.stringify(checks);
        out.dataset.ok = String(Object.values(checks).every(Boolean));
      })();
    </script>
  </body>
</html>

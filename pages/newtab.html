<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Новая вкладка</title>
    <style>
      /* Страница новой вкладки живёт в нативной вкладке, а не в chrome-е:
         она загружается через virtual host 190x4-pages.invalid и ничего не знает ни о
         Tauri, ни о его IPC. Общение с браузером — только
         window.chrome.webview.postMessage. */

      @font-face { font-family: "Inter Tight"; font-weight: 600; font-display: swap;
        src: url("./fonts/inter-tight-latin-600-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F, U+2122, U+2212; }
      @font-face { font-family: "Inter Tight"; font-weight: 600; font-display: swap;
        src: url("./fonts/inter-tight-cyrillic-600-normal.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+2116; }
      @font-face { font-family: "Inter"; font-weight: 400; font-display: swap;
        src: url("./fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F, U+2122, U+2212; }
      @font-face { font-family: "Inter"; font-weight: 400; font-display: swap;
        src: url("./fonts/inter-cyrillic-400-normal.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+2116; }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: swap;
        src: url("./fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: swap;
        src: url("./fonts/jetbrains-mono-cyrillic-500-normal.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+2116; }

      :root {
        --ink-0: #08080a; --ink-1: #0e0e11; --ink-2: #15151a; --ink-3: #1d1d24;
        --line-1: rgba(255,255,255,.04); --line-2: rgba(255,255,255,.07);
        --text-hi: #f5f5f2; --text-mid: #a3a3a8; --text-lo: #6b6b72; --text-faint: #46464c;
        --accent: #c0304a; --accent-bright: #de5772; --accent-soft: rgba(192,48,74,.14);
        --ease-emph: cubic-bezier(.16,1,.3,1);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background:
          radial-gradient(120% 80% at 50% -10%, rgba(192,48,74,.14) 0%, transparent 58%),
          var(--ink-0);
        color: var(--text-hi);
        font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: center;
        user-select: none;
      }

      .wrap { width: min(760px, calc(100vw - 96px)); }

      .clock {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 64px; font-weight: 500; letter-spacing: -.04em;
        font-variant-numeric: tabular-nums; text-align: center; line-height: 1;
      }
      .date {
        margin-top: 10px; text-align: center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase;
        color: var(--text-faint);
      }

      .search {
        margin: 40px 0 34px; display: flex; align-items: center; gap: 12px;
        height: 52px; padding: 0 18px; border-radius: 14px;
        background: var(--ink-1); border: 1px solid var(--line-2);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 50px rgba(0,0,0,.5);
        transition: border-color .16s var(--ease-emph), box-shadow .16s var(--ease-emph);
      }
      .search:focus-within {
        border-color: color-mix(in srgb, var(--accent) 55%, transparent);
        box-shadow: 0 0 0 3px var(--accent-soft), 0 20px 50px rgba(0,0,0,.5);
      }
      .search input {
        flex: 1; border: 0; background: none; outline: none;
        font-family: inherit; font-size: 15px; color: var(--text-hi);
        caret-color: var(--accent-bright); user-select: text;
      }
      .search input::placeholder { color: var(--text-faint); }

      .dials { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
      .dial {
        display: flex; flex-direction: column; align-items: center; gap: 9px;
        padding: 16px 8px 13px; border-radius: 14px;
        background: var(--ink-1); border: 1px solid var(--line-1);
        color: var(--text-mid); text-decoration: none;
        transition: background .16s var(--ease-emph), transform .16s var(--ease-emph), border-color .16s var(--ease-emph);
      }
      .dial:hover { background: var(--ink-2); border-color: var(--line-2); transform: translateY(-2px); }
      .dial__mark {
        width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
        background: var(--ink-3);
        font-family: "Inter Tight", sans-serif; font-size: 15px; font-weight: 600; color: var(--text-hi);
      }
      .dial__name {
        font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
      }

    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>

      <form class="search" id="search">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" style="color: var(--text-lo)" aria-hidden="true"><path d="M13.73 14.44a6.5 6.5 0 1 1 .7-.7l3.42 3.4a.5.5 0 0 1-.63.77l-.07-.06zm-.71-.71A5.5 5.5 0 0 0 15 9.5a5.5 5.5 0 1 0-1.98 4.23"/></svg>
        <input id="q" type="text" placeholder="Найти или ввести адрес" autocomplete="off" spellcheck="false" />
      </form>

      <div class="dials" id="dials"></div>

    </div>

    <script>
      const DIALS = [
        ["КП", "Кинопоиск", "https://www.kinopoisk.ru/"],
        ["YT", "YouTube", "https://www.youtube.com/"],
        ["GH", "GitHub", "https://github.com/"],
        ["ХБ", "Хабр", "https://habr.com/ru/"],
        ["TG", "Telegram", "https://web.telegram.org/"],
        ["ДЗ", "Дзен", "https://dzen.ru/"],
      ];

      const dials = document.getElementById("dials");
      for (const [mark, name, url] of DIALS) {
        const a = document.createElement("a");
        a.className = "dial";
        a.href = url;
        a.innerHTML = `<span class="dial__mark">${mark}</span><span class="dial__name">${name}</span>`;
        dials.append(a);
      }

      function tick() {
        const now = new Date();
        document.getElementById("clock").textContent = now.toLocaleTimeString("ru-RU", {
          hour: "2-digit",
          minute: "2-digit",
        });
        document.getElementById("date").textContent = now.toLocaleDateString("ru-RU", {
          weekday: "long",
          day: "numeric",
          month: "long",
        });
      }
      tick();
      setInterval(tick, 10_000);

      // Строка поиска здесь — та же адресная строка: разбор запроса живёт в
      // Rust (`normalize_url`), чтобы правило было одно на весь браузер.
      document.getElementById("search").addEventListener("submit", (event) => {
        event.preventDefault();
        const value = document.getElementById("q").value.trim();
        if (!value) return;
        window.chrome?.webview?.postMessage(JSON.stringify({ evt: "navigate", url: value }));
      });

    </script>
  </body>
</html>

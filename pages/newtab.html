<!doctype html>
<html lang="ru" data-theme="kurogane" data-boot="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Новая вкладка</title>
    <!-- Страница живёт в обычной вкладке на 190x4-pages.invalid и о Tauri ничего
         не знает: с браузером она говорит только через window.chrome.webview.
         Разметка — здесь, данные и поведение — в newtab.js. -->
    <!-- Первый кадр — уже в цвет темы: пока стили не загрузились, страница
         иначе мелькала бы белым или серым. Тему страница помнит сама. Пока
         нет плиток и шрифтов, содержимое не показывается: иначе оно
         дорисовывалось бы на глазах по частям (data-boot, newtab.js). -->
    <script>
      try {
        const theme = localStorage.getItem("190x4-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      html { background: #08080a; }
      html[data-theme="shiro"] { background: #fafaf8; }
      html[data-boot] body { visibility: hidden; }
    </style>
    <link rel="stylesheet" href="./newtab.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg__glow"></div>
      <div class="bg__floor"><div class="bg__grid"></div></div>
      <div class="bg__scan"></div>
      <div class="bg__noise"></div>
    </div>

    <button class="gear" id="customize" type="button" title="Настроить страницу" aria-label="Настроить страницу" aria-expanded="false">
      <svg aria-hidden="true"><use href="./icons.svg#i-settings" /></svg>
    </button>
    <div class="pop customize" id="customize-pop" role="dialog" aria-label="Настройки новой вкладки" hidden>
      <div class="pop__title">Новая вкладка</div>
      <label class="toggle"><span>Погода</span><input type="checkbox" data-pref="weather" /><i></i></label>
      <label class="toggle"><span>Ресурсы браузера</span><input type="checkbox" data-pref="monitor" /><i></i></label>
      <label class="toggle"><span>Секунды на часах</span><input type="checkbox" data-pref="seconds" /><i></i></label>
    </div>

    <main class="deck" id="deck">
      <section class="core">
        <div class="chrono" id="chrono">
          <svg class="hud" id="hud" viewBox="0 0 400 400" aria-hidden="true"></svg>
          <div class="chrono__face">
            <div class="chrono__time" id="time" role="timer" aria-live="off">
              <span id="hh">--</span><span class="chrono__colon">:</span><span id="mm">--</span>
            </div>
            <div class="chrono__sec" id="sec">--</div>
            <div class="chrono__date" id="date"></div>
          </div>
        </div>

        <form class="search" id="search" role="search" autocomplete="off">
          <svg class="search__icon" aria-hidden="true"><use href="./icons.svg#i-search" /></svg>
          <input class="search__input" id="q" type="text" placeholder="Поиск или адрес сайта" spellcheck="false" aria-label="Поиск или адрес сайта" />
          <kbd class="search__key">Enter</kbd>
        </form>

        <div class="dials" id="dials" role="list" aria-label="Сайты"></div>
      </section>

      <aside class="card weather" id="weather" aria-label="Погода" hidden>
        <header class="card__head">
          <span class="card__label">Погода</span>
          <button class="card__place" id="place" type="button" title="Выбрать город">
            <svg aria-hidden="true"><use href="./icons.svg#i-location" /></svg>
            <span id="place-name">Ищем, где вы…</span>
          </button>
        </header>

        <div class="weather__body" id="weather-body" hidden>
          <div class="weather__now">
            <svg class="weather__icon" id="w-icon" aria-hidden="true"><use href="./icons.svg#i-cloudy" /></svg>
            <div>
              <div class="weather__temp" id="w-temp">—</div>
              <div class="weather__desc" id="w-desc"></div>
            </div>
          </div>
          <div class="weather__meta">
            <span title="Ощущается как"><svg aria-hidden="true"><use href="./icons.svg#i-temperature" /></svg><span id="w-feels">—</span></span>
            <span title="Ветер"><svg aria-hidden="true"><use href="./icons.svg#i-wind" /></svg><span id="w-wind">—</span></span>
            <span title="Влажность"><svg aria-hidden="true"><use href="./icons.svg#i-humidity" /></svg><span id="w-humidity">—</span></span>
          </div>
          <div class="chart" id="w-chart">
            <svg class="chart__plot" id="w-plot" viewBox="0 0 280 56" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="chart__marks" id="w-marks"></div>
            <div class="chart__labels" id="w-hours"></div>
          </div>
          <ol class="weather__days" id="w-days"></ol>
        </div>

        <div class="weather__status" id="weather-status">
          <div class="skeleton skeleton--big"></div>
          <div class="skeleton"></div>
          <div class="skeleton skeleton--short"></div>
        </div>

        <div class="picker" id="picker" hidden>
          <div class="picker__field">
            <svg aria-hidden="true"><use href="./icons.svg#i-search" /></svg>
            <input id="picker-q" type="text" placeholder="Название города" spellcheck="false" aria-label="Название города" />
            <button class="picker__close" id="picker-close" type="button" title="Закрыть" aria-label="Закрыть">
              <svg aria-hidden="true"><use href="./icons.svg#i-dismiss" /></svg>
            </button>
          </div>
          <button class="picker__row picker__auto" id="picker-auto" type="button">
            <svg aria-hidden="true"><use href="./icons.svg#i-my-location" /></svg>
            <span>Определять автоматически</span>
          </button>
          <ul class="picker__list" id="picker-list"></ul>
        </div>
      </aside>

      <aside class="card monitor" id="monitor" aria-label="Ресурсы браузера" hidden>
        <header class="card__head">
          <span class="card__label">Ресурсы браузера</span>
          <span class="live" title="Обновляется каждую секунду"><i></i>сейчас</span>
        </header>

        <div class="metric__label">Память</div>
        <div class="metric__big"><span id="m-mem">—</span><small id="m-mem-unit"></small></div>
        <div class="membar" id="m-bar" role="img" aria-label="Память компьютера">
          <i class="membar__browser" id="m-bar-browser"></i><i class="membar__other" id="m-bar-other"></i>
        </div>
        <div class="membar__legend">
          <span><i class="dot dot--accent"></i><span id="m-share">—</span></span>
          <span id="m-system">—</span>
        </div>

        <div class="gauges" id="m-gauges">
          <div class="gauge">
            <div class="gauge__head"><span class="metric__label">Процессор</span><span class="gauge__value" id="m-cpu">—</span></div>
            <svg class="spark" id="s-cpu" viewBox="0 0 120 34" preserveAspectRatio="none" aria-hidden="true"></svg>
          </div>
          <div class="gauge" id="g-gpu">
            <div class="gauge__head"><span class="metric__label">Видеокарта</span><span class="gauge__value" id="m-gpu">—</span></div>
            <svg class="spark" id="s-gpu" viewBox="0 0 120 34" preserveAspectRatio="none" aria-hidden="true"></svg>
          </div>
        </div>

        <div class="card__sub">Что потребляет</div>
        <ul class="groups" id="m-groups"></ul>
        <footer class="monitor__foot">
          <span id="m-processes">—</span>
          <span id="m-system-cpu">—</span>
        </footer>
      </aside>
    </main>

    <div class="pop tile-menu" id="tile-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-action="edit">
        <svg aria-hidden="true"><use href="./icons.svg#i-edit" /></svg><span>Изменить</span>
      </button>
      <button type="button" role="menuitem" data-action="delete" class="danger">
        <svg aria-hidden="true"><use href="./icons.svg#i-delete" /></svg><span>Удалить</span>
      </button>
    </div>

    <dialog class="dialog" id="tile-dialog" aria-labelledby="tile-dialog-title">
      <form id="tile-form" novalidate>
        <h2 class="dialog__title" id="tile-dialog-title">Новый сайт</h2>
        <label class="field">
          <span>Адрес</span>
          <input id="tile-url" type="text" placeholder="example.com" spellcheck="false" autocomplete="off" />
        </label>
        <label class="field">
          <span>Название</span>
          <input id="tile-title" type="text" placeholder="Необязательно" maxlength="40" autocomplete="off" />
        </label>
        <div class="dialog__actions">
          <button class="btn" type="button" id="tile-cancel">Отмена</button>
          <button class="btn btn--primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <script src="./newtab.js"></script>
  </body>
</html>

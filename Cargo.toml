[workspace]
resolver = "2"
members = ["src-tauri", "crates/adblock", "crates/webview", "crates/spike", "crates/store", "crates/services"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
authors = ["pathetixx"]

# Версии COM-стека закреплены на уровне workspace намеренно: ICoreWebView2,
# который отдаёт Tauri через PlatformWebview, должен быть ТЕМ ЖЕ типом, что
# используют наши крейты. wry 0.55 (Tauri 2.11) тянет webview2-com 0.38 →
# windows 0.61. Разные мажорки = разные типы = `expected ICoreWebView2, found
# ICoreWebView2` на ровном месте. Перед бампом Tauri сверять `cargo tree -i webview2-com`.
[workspace.dependencies]
webview2-com = "0.38"
windows = "0.61"
windows-core = "0.61"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1.7"
parking_lot = "0.12"
anyhow = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
# PDB рядом со сборкой: сторож главного потока пишет в лог стек зависания
# адресами модуля, а по PDB из артефакта сборки они превращаются в строки кода.
# В exe отладочной информации нет, он растёт на ~1 МБ.
debug = "line-tables-only"
strip = "none"

# Спайк меряет задержку матчинга — в debug adblock-rust медленнее на порядок,
# цифры были бы мусором. Оптимизируем зависимости даже в dev-профиле.
[profile.dev.package."*"]
opt-level = 2

[package]
name = "browser190x4"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "190x4 Browser — chrome на Tauri 2, вкладки на сыром WebView2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
browser190x4-adblock = { path = "../crates/adblock" }
browser190x4-webview = { path = "../crates/webview" }
browser190x4-store = { path = "../crates/store" }
browser190x4-services = { path = "../crates/services" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Один процесс: повторный запуск (ссылка из другой программы) отдаёт адреса первому.
tauri-plugin-single-instance = "2"
# Расширенные фильтры: скачивание и сверка с манифестом (filters.rs).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
# Значки сайтов на плитках новой вкладки — data:-адресами.
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Только таймер: опрос прогресса загрузки идёт в фоновой задаче Tauri.
tokio = { version = "1", features = ["time"] }
parking_lot.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Devices_Geolocation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[lib]
name = "browser190x4"
crate-type = ["lib"]

[[bin]]
# Так называется процесс в диспетчере задач.
name = "190x4-browser"
path = "src/main.rs"

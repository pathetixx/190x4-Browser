name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Единственная настоящая проверка: движковая часть собирается только под
  # Windows (WebView2 COM), поэтому компиляция всего workspace живёт здесь.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Списки фильтров
        run: pwsh scripts/fetch-lists.ps1

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace --release

      - name: Артефакты спайка
        uses: actions/upload-artifact@v4
        with:
          name: browser190x4-spike
          path: target/release/190x4-spike.exe
          if-no-files-found: error

  # Кроссплатформенная часть: фильтр не зависит от Windows, его тесты
  # гоняются быстро и ловят регрессии правил до долгой windows-сборки.
  adblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p browser190x4-adblock

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Синтаксис модулей chrome-а
        run: find ui/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Скрипт менеджера паролей
        run: |
          google-chrome --headless=new --no-sandbox --virtual-time-budget=6000 --dump-dom \
            "file://$PWD/scripts/test/passwords-script.html" | tee /tmp/passwords.html | grep -o '<pre id="out"[^<]*</pre>'
          grep -q 'data-ok="true"' /tmp/passwords.html

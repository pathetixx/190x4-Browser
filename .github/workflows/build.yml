name: Build 190x4 Browser

on:
  push:
    # Только теги: сборка на push в main шла бы параллельно с тегом того же
    # коммита и ничего не защищала. Для проверки без релиза — workflow_dispatch.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Кроссплатформенная часть: фильтр, синтаксис интерфейса, скрипт паролей.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Adblock tests
        run: cargo test -p browser190x4-adblock

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Interface module syntax
        run: find ui/js scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

      - name: Password manager script
        run: |
          google-chrome --headless=new --no-sandbox --virtual-time-budget=6000 --dump-dom \
            "file://$PWD/scripts/test/passwords-script.html" | tee /tmp/passwords.html | grep -o '<pre id="out"[^<]*</pre>'
          grep -q 'data-ok="true"' /tmp/passwords.html

  # Движковая часть собирается только под Windows (WebView2 COM). Проверки
  # Rust — отдельной задачей: если упадёт сборка установщика или публикация,
  # «Re-run failed jobs» перезапустит только их, без повторных тестов.
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "tag ${{ github.ref_name }} does not match version $version"; exit 1
          }

      - name: Filter lists
        run: pwsh scripts/fetch-lists.ps1

      - name: Format Rust
        run: cargo fmt --all -- --check

      - name: Clippy Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

  installer:
    needs: [checks, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Filter lists
        run: pwsh scripts/fetch-lists.ps1

      - name: Build installer
        run: npx --yes @tauri-apps/cli@2.11.4 build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # GitHub заменяет пробелы в именах ассетов точками, и ссылка из
      # latest.json вела бы в пустоту. Подпись — по содержимому, имя не важно.
      - name: Installer name without spaces
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis -File | Where-Object { $_.Name -like '*-setup.exe*' } | ForEach-Object {
            $name = $_.Name -replace ' ', '-'
            if ($name -ne $_.Name) { Rename-Item -LiteralPath $_.FullName -NewName $name }
          }
          Get-ChildItem target/release/bundle/nsis -File | Select-Object Name, Length

      - name: Generate latest.json (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          $nsis = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS setup not found"; exit 1 }
          $sigPath = "$($nsis.FullName).sig"
          if (-not (Test-Path $sigPath)) { Write-Error "Signature not found: $sigPath"; exit 1 }
          $sig = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/pathetixx/190x4-Browser/releases/download/$tag/$($nsis.Name)"
          # Заметки — из аннотации тега: она есть уже во время сборки, релиз
          # создаётся позже. gh отдаёт тело построчно — склеиваем в строку,
          # иначе updater прочитал бы массив как «обновлений нет».
          git fetch origin "+refs/tags/$($tag):refs/tags/$($tag)" --force 2>$null
          $global:LASTEXITCODE = 0
          $notes = (git tag -l $tag --format='%(contents)' 2>$null | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            try {
              $raw = gh release view $tag --json body --jq .body 2>$null
              if ($LASTEXITCODE -eq 0) {
                if ($raw -is [array]) { $notes = ($raw -join "`n") } else { $notes = [string]$raw }
              }
            } catch { $notes = "" }
            $global:LASTEXITCODE = 0
          }
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Заметки к релизу недоступны." }
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
          $tagDate = (git for-each-ref --format='%(creatordate:iso8601-strict)' "refs/tags/$tag" | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($tagDate)) { $tagDate = (git show -s --format=%cI HEAD | Out-String).Trim() }
          $pubDate = ([DateTimeOffset]::Parse($tagDate)).UtcDateTime.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig; url = $url }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path latest.json -Value $json -Encoding UTF8
          Get-Content latest.json

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

      - name: Upload release metadata
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-release-metadata
          path: |
            latest.json
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  release-on-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-windows
          path: artifacts/windows

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-release-metadata
          path: artifacts/metadata

      - name: Restore release layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release/bundle/nsis
          nsis="$(find artifacts/windows -type f -name '*-setup.exe' -print -quit)"
          sig="$(find artifacts/windows -type f -name '*-setup.exe.sig' -print -quit)"
          [[ -n "$nsis" && -n "$sig" ]]
          cp "$nsis" "$sig" target/release/bundle/nsis/
          cp artifacts/metadata/latest.json latest.json
          cp artifacts/metadata/release-notes.md release-notes.md

      # Основной источник обновлений. GitHub-релиз публикуется только после
      # того, как GitLab stable/latest.json переключён и перепроверен.
      - name: Mirror update to GitLab
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: "86438976"
          GITLAB_PACKAGE: 190x4-browser
        run: python scripts/gitlab_mirror.py

      - name: Release on tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: 190x4 Browser ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            latest.json
          fail_on_unmatched_files: true
          # prerelease выпадает из Latest, и updater получил бы старый latest.json.
          prerelease: false
          make_latest: "true"

      - name: Verify published update sources
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          node scripts/release.mjs "$version" --verify
